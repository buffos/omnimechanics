<div class="app-layout">
  <!-- Top Navigation Bar Component -->
  <app-header
    [activeWorkspaceMode]="activeWorkspaceMode()"
    [activeDimension]="activeDimension()"
    [activeDomain]="activeDomain()"
    [backendStatus]="backendStatus()"
    (modeChange)="activeWorkspaceMode.set($event)"
    (dimensionChange)="setDimension($event)"
    (domainChange)="setDomain($event)"
    (openGuide)="openSolverMethodsDialog()"
  />

  <!-- Mode 3: Structural Mechanics Teaching Studio -->
  @if (activeWorkspaceMode() === 'teaching') {
    <app-teaching-studio />
  } @else {
    <!-- Mode 1: Continuum Mechanics Simulation Workspace -->
    <main class="main-workspace">
      <!-- Left Inspector Panel -->
      <aside class="sidebar-panel">
      <!-- Workflow Navigation Tabs -->
      <div class="sidebar-tabs">
        <button
          type="button"
          class="sidebar-tab-btn"
          [class.active]="activeSidebarTab() === 'mesh'"
          (click)="activeSidebarTab.set('mesh')"
        >
          <span class="tab-icon">📐</span>
          <span>Geometry</span>
        </button>

        <button
          type="button"
          class="sidebar-tab-btn"
          [class.active]="activeSidebarTab() === 'material'"
          (click)="activeSidebarTab.set('material')"
        >
          <span class="tab-icon">🧪</span>
          <span>Material</span>
        </button>

        <button
          type="button"
          class="sidebar-tab-btn"
          [class.active]="activeSidebarTab() === 'solver'"
          (click)="activeSidebarTab.set('solver')"
        >
          <span class="tab-icon">⚡</span>
          <span>Solver</span>
        </button>
      </div>

      <div class="sidebar-content">
        @if (activeSidebarTab() === 'mesh') {
          <app-geometry-tab
            [(selectedPreset)]="selectedPreset"
            [(beamLength)]="beamLength"
            [(beamHeight)]="beamHeight"
            [(beamNx)]="beamNx"
            [(beamNy)]="beamNy"
            [(beamUseTriangles)]="beamUseTriangles"
            [(plateWidth)]="plateWidth"
            [(plateHeight)]="plateHeight"
            [(plateRadius)]="plateRadius"
            [(plateRadialDivs)]="plateRadialDivs"
            [(plateAngularDivs)]="plateAngularDivs"
            [(beam3dLength)]="beam3dLength"
            [(beam3dHeight)]="beam3dHeight"
            [(beam3dDepth)]="beam3dDepth"
            [(beam3dNx)]="beam3dNx"
            [(beam3dNy)]="beam3dNy"
            [(beam3dNz)]="beam3dNz"
            [(beam3dUseTets)]="beam3dUseTets"
            (presetChange)="onPresetChange($event)"
            (generateMesh)="generateCurrentMesh()"
          />
        } @else if (activeSidebarTab() === 'material') {
          <app-material-tab
            [(selectedStrategy)]="selectedStrategy"
            [(activeMetric)]="activeMetric"
            [(gradientAxis)]="gradientAxis"
            [(gradientAlpha)]="gradientAlpha"
            [(gradientForm)]="gradientForm"
            [(mathExpression)]="mathExpression"
            [(inclusionShape)]="inclusionShape"
            [(inclusionRadius)]="inclusionRadius"
            [(inclusionE)]="inclusionE"
            [(inclusionSmooth)]="inclusionSmooth"
            [(vcFc)]="vcFc"
            [(vcEps0)]="vcEps0"
            [(vcSimStrain)]="vcSimStrain"
            [(j2SigmaY)]="j2SigmaY"
            [(j2Hardening)]="j2Hardening"
            [(j2PlasticStrain)]="j2PlasticStrain"
            (strategyChange)="onStrategyChange($event)"
            (metricChange)="onMetricChange($event)"
            (evaluateMaterial)="evaluateCurrentMaterial()"
          />
        } @else if (activeSidebarTab() === 'solver') {
          <app-solver-tab
            [hasMesh]="meshService.currentMesh() !== null"
            [(activeDimension)]="activeDimension"
            [(activeDomain)]="activeDomain"
            [solverMode]="solverMode()"
            (solverModeChange)="onSolverModeChange($event)"
            [(stressState)]="stressState"
            [(bemElementType)]="bemElementType"
            [(harmonicSolverMode)]="harmonicSolverMode"
            [(dynamicFrequency)]="dynamicFrequency"
            [(mediumConfig)]="mediumConfig"
            [(transientMethod)]="transientMethod"
            [(transientSolverMode)]="transientSolverMode"
            [(transientExcitation)]="transientExcitation"
            [(transientFrequency)]="transientFrequency"
            [(dynamicPulseDuration)]="dynamicPulseDuration"
            [(dynamicTotalTime)]="dynamicTotalTime"
            [(dynamicTimeSteps)]="dynamicTimeSteps"
            [(dynamicNumTalbotPoints)]="dynamicNumTalbotPoints"
            [(hhtAlpha)]="hhtAlpha"
            [(rayleighAlpha)]="rayleighAlpha"
            [(loadMagnitude)]="loadMagnitude"
            [(maxIterations)]="maxIterations"
            [(solverTolerance)]="solverTolerance"
            (domainChange)="setDomain($event)"
            (openGuide)="openSolverMethodsDialog()"
            (openMediumDialog)="openSurroundingMediumDialog()"
            (solve)="runSolver()"
          />
        }
      </div>
    </aside>

    <!-- Center / Right: Three.js Interactive Canvas + Bottom Engineering Dock -->
    <div class="viewport-wrapper">
      <app-viewport
        [activeDomain]="activeDomain()"
        [mesh]="meshService.currentMesh()"
        [materialField]="materialService.fieldResult()"
        [simulationResult]="solverService.currentResult()"
        [harmonicResult]="solverService.harmonicResult()"
        [transientResult]="solverService.transientResult()"
        [currentFrameIndex]="solverService.currentFrameIndex()"
        [isPlayingAnimation]="solverService.isPlayingAnimation()"
        (playAnimation)="solverService.playAnimation()"
        (pauseAnimation)="solverService.pauseAnimation()"
        (setFrameIndex)="solverService.setFrame($event)"
      />

      <!-- Collapsible Bottom Engineering Dock with Response History Chart -->
      <app-bottom-dock />
    </div>
  </main>
  }

  <app-dialog-host />
  <app-notification-host />
</div>
