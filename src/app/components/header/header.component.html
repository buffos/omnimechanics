<header class="app-header">
  <div class="logo-group">
    <img src="assets/logo.png" alt="OmniMechanics" class="app-logo-icon" />
    <div class="title-meta">
      <h1>OmniMechanics</h1>
      <span class="subtitle">Structural Mechanics &amp; Continuum Simulation Platform</span>
    </div>
  </div>

  <!-- Dimension & Mode Switchers -->
  <div class="header-controls">
    <!-- Top-Level Application Mode Switcher -->
    <div class="segmented-control mode-switcher">
      <button
        type="button"
        [class.active]="activeWorkspaceMode() === 'continuum'"
        (click)="modeChange.emit('continuum')"
        title="Mode 1: Continuum BEM-FEM Simulation Workbench"
      >
        {{ i18n.t('nav.continuum') }}
      </button>
      <button
        type="button"
        [class.active]="activeWorkspaceMode() === 'modeler'"
        (click)="modeChange.emit('modeler')"
        title="Mode 2: Structural Modeling & Analysis (Eurocodes EN 1990/EN 1998)"
      >
        {{ i18n.t('nav.modeler') }}
      </button>
      <button
        type="button"
        [class.active]="activeWorkspaceMode() === 'teaching'"
        (click)="modeChange.emit('teaching')"
        title="Mode 3: Educational Structural Mechanics Studio"
      >
        {{ i18n.t('nav.teaching') }}
      </button>
    </div>

    <!-- Language Switcher Toggle -->
    <button
      type="button"
      class="lang-switcher-btn"
      (click)="i18n.toggleLanguage()"
      [title]="i18n.currentLang() === 'el' ? 'Switch to English' : 'Αλλαγή σε Ελληνικά'"
    >
      <span>{{ i18n.currentLang() === 'el' ? '🇬🇷 EL' : '🇬🇧 EN' }}</span>
    </button>

    @if (activeWorkspaceMode() === 'continuum') {
      <div class="segmented-control">
        <button
          type="button"
          [class.active]="activeDimension() === '2D'"
          (click)="dimensionChange.emit('2D')"
        >
          2D Continuum
        </button>
        <button
          type="button"
          [class.active]="activeDimension() === '3D'"
          (click)="dimensionChange.emit('3D')"
        >
          3D Solid
        </button>
      </div>
    }
  </div>

  <!-- Backend Status Chip -->
  <div class="status-chip">
    <span class="pulse-indicator"></span>
    <span>{{ backendStatus() }}</span>
  </div>
</header>
