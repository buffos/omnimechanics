<header class="app-header">
  <div class="logo-group">
    <img src="assets/logo.png" alt="OmniMechanics" class="app-logo-icon" />
    <div class="title-meta">
      <h1>OmniMechanics</h1>
      <span class="subtitle">Structural Mechanics &amp; Continuum Simulation Platform</span>
    </div>
  </div>

  <!-- Dimension & Mode Switchers -->
  <div class="header-controls">
    <div class="segmented-control">
      <button
        type="button"
        [class.active]="activeDimension() === '2D'"
        (click)="dimensionChange.emit('2D')"
      >
        2D Continuum
      </button>
      <button
        type="button"
        [class.active]="activeDimension() === '3D'"
        (click)="dimensionChange.emit('3D')"
      >
        3D Solid
      </button>
    </div>

    <div class="segmented-control">
      <button
        type="button"
        [class.active]="activeDomain() === 'Static'"
        (click)="domainChange.emit('Static')"
      >
        Static
      </button>
      <button
        type="button"
        [class.active]="activeDomain() === 'TimeDomain'"
        (click)="domainChange.emit('TimeDomain')"
      >
        Time Domain
      </button>
      <button
        type="button"
        [class.active]="activeDomain() === 'LaplaceTalbot'"
        (click)="domainChange.emit('LaplaceTalbot')"
      >
        Laplace (Talbot)
      </button>
    </div>
  </div>

  <!-- Backend Status Chip -->
  <div class="status-chip">
    <span class="pulse-indicator"></span>
    <span>{{ backendStatus() }}</span>
  </div>

  <!-- Solvers Guide Trigger Button -->
  <button
    type="button"
    class="btn-guide-header"
    (click)="openGuide.emit()"
    title="View theoretical classification and methodological roles of all solvers"
  >
    <span>ℹ️ Solvers Taxonomy &amp; Roles</span>
  </button>
</header>
